<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" font-family="Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif" role="img" aria-label="PicoMondo project timeline" xmlns:c2pa="http://c2pa.org/manifest">
<title>PicoMondo project timeline</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9db5a8"/></marker><marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e3b341"/></marker><marker id="arrb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5cc8ff"/></marker></defs>
<rect width="1200" height="600" rx="18" fill="#0e1a14"/>
<text x="40" y="54" font-size="26" fill="#eef4f0" font-weight="700" text-anchor="start" >From feature creep to a board on the bench</text>
<text x="40" y="80" font-size="15" fill="#9db5a8" font-weight="400" text-anchor="start" >One year, two designs, one hard scope cut.</text>
<path d="M110,150 L1090,150" stroke="#2a4a3a" stroke-width="4" stroke-linecap="round"/>
<circle cx="110.0" cy="150" r="11" fill="#0e1a14" stroke="#5cc8ff" stroke-width="4"/>
<rect x="25.0" y="184" width="170" height="164" rx="10" fill="#15281f" stroke="#2a4a3a"/>
<rect x="25.0" y="184" width="170" height="4" rx="2" fill="#5cc8ff"/>
<text x="39.0" y="212" font-size="12.5" fill="#5cc8ff" font-weight="700" text-anchor="start" >Nov 2025</text>
<text x="39.0" y="236" font-size="16" fill="#eef4f0" font-weight="700" text-anchor="start" >The problem</text>
<text x="39.0" y="262" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >Pico exhibits run out</text>
<text x="39.0" y="281" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >of GPIO; shift</text>
<text x="39.0" y="300" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >registers everywhere.</text>
<circle cx="306.0" cy="150" r="11" fill="#0e1a14" stroke="#9db5a8" stroke-width="4"/>
<rect x="221.0" y="184" width="170" height="164" rx="10" fill="#15281f" stroke="#2a4a3a"/>
<rect x="221.0" y="184" width="170" height="4" rx="2" fill="#9db5a8"/>
<text x="235.0" y="212" font-size="12.5" fill="#9db5a8" font-weight="700" text-anchor="start" >Feb–Jun 2026</text>
<text x="235.0" y="236" font-size="16" fill="#eef4f0" font-weight="700" text-anchor="start" >Everything board</text>
<text x="235.0" y="262" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >10 sheets: USB-PD,</text>
<text x="235.0" y="281" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >5 A buck-boost, power</text>
<text x="235.0" y="300" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >monitors, Arduino and</text>
<text x="235.0" y="319" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >Pico sockets.</text>
<circle cx="502.0" cy="150" r="11" fill="#0e1a14" stroke="#ff6b6b" stroke-width="4"/>
<rect x="417.0" y="184" width="170" height="164" rx="10" fill="#15281f" stroke="#2a4a3a"/>
<rect x="417.0" y="184" width="170" height="4" rx="2" fill="#ff6b6b"/>
<text x="431.0" y="212" font-size="12.5" fill="#ff6b6b" font-weight="700" text-anchor="start" >Oct 2026</text>
<text x="431.0" y="236" font-size="16" fill="#eef4f0" font-weight="700" text-anchor="start" >It won't route</text>
<text x="431.0" y="262" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >Scope reset, one rule:</text>
<text x="431.0" y="281" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >a feature is in v1 only</text>
<text x="431.0" y="300" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >if an exhibit is blocked</text>
<text x="431.0" y="319" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >without it.</text>
<circle cx="698.0" cy="150" r="11" fill="#0e1a14" stroke="#e3b341" stroke-width="4"/>
<rect x="613.0" y="184" width="170" height="164" rx="10" fill="#15281f" stroke="#2a4a3a"/>
<rect x="613.0" y="184" width="170" height="4" rx="2" fill="#e3b341"/>
<text x="627.0" y="212" font-size="12.5" fill="#e3b341" font-weight="700" text-anchor="start" >Late Oct 2026</text>
<text x="627.0" y="236" font-size="16" fill="#eef4f0" font-weight="700" text-anchor="start" >v1 ordered</text>
<text x="627.0" y="262" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >Rebuilt on the</text>
<text x="627.0" y="281" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >Raspberry Pi reference</text>
<text x="627.0" y="300" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >core. 4-layer, sent</text>
<text x="627.0" y="319" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >to JLCPCB.</text>
<circle cx="894.0" cy="150" r="11" fill="#0e1a14" stroke="#ff9f43" stroke-width="4"/>
<circle cx="894.0" cy="150" r="19" fill="none" stroke="#ff9f43" stroke-width="1.5" opacity="0.6"/>
<text x="894.0" y="120" font-size="11.5" fill="#ff9f43" font-weight="700" text-anchor="middle" letter-spacing="2">NOW</text>
<rect x="809.0" y="184" width="170" height="164" rx="10" fill="#15281f" stroke="#2a4a3a"/>
<rect x="809.0" y="184" width="170" height="4" rx="2" fill="#ff9f43"/>
<text x="823.0" y="212" font-size="12.5" fill="#ff9f43" font-weight="700" text-anchor="start" >Nov 2026</text>
<text x="823.0" y="236" font-size="16" fill="#eef4f0" font-weight="700" text-anchor="start" >Arrives bare</text>
<text x="823.0" y="262" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >No assembly: laser-cut</text>
<text x="823.0" y="281" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >a paste stencil and</text>
<text x="823.0" y="300" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >hand-solder the</text>
<text x="823.0" y="319" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >0.4 mm QFN-80.</text>
<circle cx="1090.0" cy="150" r="11" fill="#0e1a14" stroke="#4cd087" stroke-width="4"/>
<rect x="1005.0" y="184" width="170" height="164" rx="10" fill="#15281f" stroke="#2a4a3a"/>
<rect x="1005.0" y="184" width="170" height="4" rx="2" fill="#4cd087"/>
<text x="1019.0" y="212" font-size="12.5" fill="#4cd087" font-weight="700" text-anchor="start" >Next</text>
<text x="1019.0" y="236" font-size="16" fill="#eef4f0" font-weight="700" text-anchor="start" >Bring-up + v2</text>
<text x="1019.0" y="262" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >Test in real exhibits;</text>
<text x="1019.0" y="281" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >PSRAM, USB-PD and</text>
<text x="1019.0" y="300" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >buck-boost return</text>
<text x="1019.0" y="319" font-size="13" fill="#9db5a8" font-weight="400" text-anchor="start" >in v2.</text>
<text x="40" y="420" font-size="12.5" fill="#9db5a8" font-weight="700" text-anchor="start" letter-spacing="2">WHAT THE SCOPE CUT BOUGHT</text>
<text x="40" y="465" font-size="15" fill="#eef4f0" font-weight="600" text-anchor="start" >Raspberry Pi Pico</text>
<rect x="250" y="446" width="560" height="26" rx="6" fill="#15281f"/>
<rect x="250" y="446" width="364" height="26" rx="6" fill="#9db5a8" opacity="0.55"/>
<text x="604.0" y="464" font-size="14" fill="#0e1a14" font-weight="700" text-anchor="end" >26</text>
<text x="826" y="464" font-size="13.5" fill="#9db5a8" font-weight="400" text-anchor="start" >26 GPIO on 0.1" pins</text>
<text x="40" y="509" font-size="15" fill="#eef4f0" font-weight="600" text-anchor="start" >Full-scope design</text>
<rect x="250" y="490" width="560" height="26" rx="6" fill="#15281f"/>
<rect x="250" y="490" width="392" height="26" rx="6" fill="#9db5a8" opacity="0.55"/>
<text x="632.0" y="508" font-size="14" fill="#0e1a14" font-weight="700" text-anchor="end" >28</text>
<text x="826" y="508" font-size="13.5" fill="#9db5a8" font-weight="400" text-anchor="start" >28 GPIO on EdgeLock</text>
<text x="40" y="553" font-size="15" fill="#eef4f0" font-weight="600" text-anchor="start" >PicoMondo v1</text>
<rect x="250" y="534" width="560" height="26" rx="6" fill="#15281f"/>
<rect x="250" y="534" width="532" height="26" rx="6" fill="#e3b341" opacity="1"/>
